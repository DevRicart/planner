services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: planner-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    networks:
      - planner

  nginx:
    image: nginx:alpine
    container_name: planner-nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - planner

  mysql:
    image: mysql:8
    container_name: planner-mysql
    environment:
      MYSQL_DATABASE: planner
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - planner

  node:
    image: node:20
    container_name: planner-node
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - planner

networks:
  planner:

volumes:
  db:
  vendor:
  node_modules: